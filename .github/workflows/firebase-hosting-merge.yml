# Deploy the Vite SPA to Firebase Hosting on merge to main.
# Auth: Workload Identity Federation (org policy blocks SA JSON keys).
# Requires repo secrets: VITE_FIREBASE_*, VITE_API_BASE_URL, VITE_INITIAL_ADMIN_EMAIL

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hosting env secrets
        run: node scripts/check-hosting-env.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npm ci && npm run build:firebase
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_INITIAL_ADMIN_EMAIL: ${{ secrets.VITE_INITIAL_ADMIN_EMAIL }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/907740072738/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-firebase-hosting@sop-pt-2.iam.gserviceaccount.com
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting --project sop-pt-2 --non-interactive
