# Deploys services/api to Cloud Run when API sources change on main.
# Auth: Workload Identity Federation (org policy blocks SA JSON keys).
# Optional vars: CLOUD_RUN_SERVICE (default sop-pt-api), CLOUD_RUN_REGION (default us-west1)
# After first deploy, set Hosting secret VITE_API_BASE_URL to the service URL.

name: Deploy Cloud Run API
on:
  push:
    branches:
      - main
    paths:
      - 'services/api/**'
      - '.github/workflows/cloud-run-api.yml'
      - 'scripts/deploy-api.sh'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/907740072738/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-cloud-run@sop-pt-2.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy sop-pt-api
        env:
          GOOGLE_CLOUD_PROJECT: sop-pt-2
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION || 'us-west1' }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'sop-pt-api' }}
          ADMIN_EMAIL_ALLOWLIST: ${{ secrets.VITE_INITIAL_ADMIN_EMAIL }}
        run: bash scripts/deploy-api.sh
