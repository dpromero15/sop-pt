# Preview channel on PRs. Auth: Workload Identity Federation (org policy blocks SA JSON keys).

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Hosting env secrets
        run: node scripts/check-hosting-env.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npm ci && npm run build:firebase
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_INITIAL_ADMIN_EMAIL: ${{ secrets.VITE_INITIAL_ADMIN_EMAIL }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/907740072738/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-firebase-hosting@sop-pt-2.iam.gserviceaccount.com
      - run: npm install -g firebase-tools
      - name: Deploy Hosting preview channel
        run: firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --project sop-pt-2 --non-interactive
