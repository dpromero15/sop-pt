# API Gateway OpenAPI 2.0 config for sop-pt-api.
# Backend address is substituted by scripts/deploy-api-gateway.sh via BACKEND_URL.
# GATEWAY_HOST is substituted to the live gateway hostname (CORS allowCors).
# Clients call the gateway hostname only — never the Cloud Run URL.
swagger: "2.0"
info:
  title: sop-pt-api
  description: SOP-PT Cloud Run API fronted by API Gateway (Firebase JWT on /v1).
  version: "2.9.0"
host: "GATEWAY_HOST"
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json

# Pass CORS preflight through to Cloud Run (Express cors). JWT must NOT
# apply to OPTIONS — browsers omit Authorization on preflight.
x-google-endpoints:
  - name: "GATEWAY_HOST"
    allowCors: True

# Cheap abuse cap: shared request quota (per project).
x-google-management:
  metrics:
    - name: "request-count"
      displayName: "Request count"
      valueType: INT64
      metricKind: DELTA
  quota:
    limits:
      - name: "requests-per-minute"
        metric: "request-count"
        unit: "1/min/{project}"
        values:
          STANDARD: 120

securityDefinitions:
  firebase:
    authorizationUrl: ""
    flow: implicit
    type: oauth2
    x-google-issuer: "https://securetoken.google.com/sop-pt-2"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com"
    x-google-audiences: "sop-pt-2"

x-google-backend:
  address: "BACKEND_URL"
  pathTranslation: APPEND_PATH_TO_ADDRESS
  # Gateway SA (api-gateway@…) authenticates to private Cloud Run.
  disable_auth: false

paths:
  /health:
    get:
      operationId: health
      summary: Liveness (no auth)
      security: []
      x-google-quota:
        metricCosts:
          request-count: 1
      responses:
        "200":
          description: OK
    options:
      operationId: corsHealth
      security: []
      x-google-quota:
        metricCosts:
          request-count: 1
      responses:
        "204":
          description: CORS preflight

  /v1/me:
    get:
      operationId: getMe
      security:
        - firebase: []
      x-google-quota:
        metricCosts:
          request-count: 1
      responses:
        "200":
          description: OK
    options:
      operationId: corsMe
      security: []
      x-google-quota:
        metricCosts:
          request-count: 1
      responses:
        "204":
          description: CORS preflight

  /v1/status:
